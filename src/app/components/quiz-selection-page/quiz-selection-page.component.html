<div class="p-4 max-w-md mx-auto">
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-2 bg-orange-100 text-orange-600 rounded-full px-4 py-1 font-semibold">
      <span>🔥</span>
      <span>123</span>
    </div>
    <div class="flex items-center gap-2 bg-yellow-100 text-yellow-700 rounded-full px-4 py-1 font-semibold">
      <span>🎟</span>
      <span>420</span>
      <span>📊</span>
    </div>
  </div>

  <h2 class="text-2xl font-bold text-center mb-2">Race against the time</h2>
  <p class="text-center text-gray-600 mb-4">Answer as many questions as possible before the time runs out!</p>

  <div class="mb-6">
    <select [(ngModel)]="selectedCategory" class="form-select w-full border rounded-md px-3 py-2">
      <option value="">All categories</option>
      <option value="sci-fi">Sci-fi</option>
      <option value="history">History</option>
      <option value="geography">Geography</option>
    </select>
  </div>

  <button class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-bold py-3 rounded-lg mb-10">
    Start Quiz →
  </button>

  <h2 class="text-2xl font-bold text-center mb-2">Weekly Quiz</h2>
  <p class="text-center text-gray-600 mb-4">
    Challenge yourself in this week’s category and see where you place on the leaderboard!
  </p>

  <div class="bg-cyan-100 text-center text-lg font-medium rounded-md py-3 mb-4">
    {{ weeklyCategory }}
  </div>

  <button class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-bold py-3 rounded-lg">
    Start Quiz →
  </button>
</div>

<div class="fixed bottom-0 w-full bg-white border-t">
  <div class="flex justify-around py-2">
    <button class="flex flex-col items-center text-gray-500">
      <span class="text-xl">🧪</span>
      <span class="text-sm">Facts</span>
    </button>
    <button class="flex flex-col items-center text-cyan-700">
      <span class="text-xl">🧠</span>
      <span class="text-sm font-semibold">Quiz</span>
    </button>
    <button class="flex flex-col items-center text-gray-500">
      <span class="text-xl">🛍</span>
      <span class="text-sm">Shop</span>
    </button>
  </div>
</div>
