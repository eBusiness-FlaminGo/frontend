<div class="container mx-auto p-4 max-w-7xl">
  <div class="mb-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">Liked Facts</h1>
    <button *ngIf="likedFacts().length > 0"
            (click)="clearAllLikedFacts()"
            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
      Clear All
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="likedFacts().length === 0" class="text-center py-16">
    <svg class="w-16 h-16 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
    </svg>
    <p class="mt-4 text-lg text-gray-600">You haven't liked any facts yet</p>
    <a routerLink="/facts"
       class="inline-block mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
      Discover Facts
    </a>
  </div>

  <!-- Liked facts grid -->
  <div *ngIf="likedFacts().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let fact of likedFacts()"
         [@fadeSlide]
         class="relative rounded-lg p-4 shadow-md transition-all hover:shadow-lg overflow-hidden"
         [style.background-color]="fact.bg || '#f3f4f6'">
      <div class="absolute top-3 right-3">
        <button (click)="unlikeFact(fact)" class="text-red-500 hover:text-red-700">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
          </svg>
        </button>
      </div>
      <span class="inline-block px-2 py-1 rounded text-xs font-medium bg-white bg-opacity-50 mb-2">
          {{ fact.category === "*" ? 'General facts' : fact.category }}
        </span>
      <h3 class="text-lg font-semibold mb-2">{{ fact.category === "*" ? 'General facts' : fact.category }}</h3>
      <p class="text-gray-800">{{ fact.message }}</p>
    </div>
  </div>
</div>
