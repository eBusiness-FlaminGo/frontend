<div class="p-4 max-w-md mx-auto text-center space-y-6">
  <div class="text-left text-lg font-semibold">Lootbox</div>
  <hr/>

  <div class="flex justify-center">
    <img *ngIf="!chestOpen" src="./chest-closed-glow.png" class="h-50"/>
    <img *ngIf="chestOpen" src="./chest-closed-glow.png" class="h-50"/>
  </div>

  <div class="bg-cyan-100 p-4 rounded-lg space-y-4">
    <div class="font-bold text-lg">REWARD: Pick One</div>

    <div class="flex justify-center gap-4">
      <div *ngFor="let reward of rewards" class="relative"
           [ngClass]="{ 'cursor-pointer': !selectedReward && chestOpen }"
           (click)="chestOpen && !selectedReward && pickReward(reward)">
        <div *ngIf="!chestOpen || !selectedReward" class="bg-cyan-600 text-white p-4 rounded-lg text-xl">?</div>
        <div *ngIf="chestOpen && selectedReward === reward"
             class="bg-white p-4 rounded-lg shadow text-center">
          <div class="text-2xl">{{ reward.icon }}</div>
          <div class="text-sm font-medium">{{ reward.label }}</div>
          <div class="text-xs">+{{ reward.count }}</div>
        </div>
      </div>
    </div>

    <div *ngIf="!chestOpen" class="flex justify-center">
      <button (click)="openChest()"
              class="bg-cyan-600 text-white px-6 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
        🔥 OPEN
      </button>
    </div>

    <div *ngIf="chestOpen && selectedReward" class="flex justify-between mt-4">
      <button class="bg-cyan-900 text-white px-4 py-2 rounded shadow">Back to Game</button>
      <button class="bg-cyan-600 text-white px-4 py-2 rounded shadow" (click)="openNext()">OPEN NEXT</button>
    </div>
  </div>
</div>
