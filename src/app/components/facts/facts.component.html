<div class="container mx-auto py-10 px-4 max-w-xl">
  <ng-container *ngIf="currentIndex >= 0 && facts[currentIndex]; else emptyMessage">
    <div
      class="rounded-4xl p-6 shadow-md cursor-default"
      [@cardAnimation]="animationState"
      [ngClass]="facts[currentIndex].bg"
      (touchstart)="swipe($event, 'start')" (touchend)="swipe($event, 'end')"
    >
      <h3 class="text-xl font-bold mb-2 text-gray-900">
        {{ facts[currentIndex].title }}
      </h3>
      <p class="text-gray-700 mb-4">{{ facts[currentIndex].content }}</p>

      <div class="flex justify-center mt-4">
        <button
          class="bg-primary-500 hover:bg-primary-600 text-white font-bold py-2 px-4 rounded-full flex items-center space-x-2"
          aria-label="Share the fact"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.48 3.48 0 000-1.4l7.05-4.11a3 3 0 10-.91-1.63L8 9.67a3 3 0 100 4.66l7.14 4.16c.5-.46 1.16-.75 1.86-.75a3 3 0 100-6z"/>
          </svg>
          <span>Share the fact</span>
        </button>
      </div>

      <div class="mt-6" *ngIf="getFilteredAd(facts[currentIndex].category) as ad">
        <h4 class="text-lg font-semibold mb-2">Sponsored Ad</h4>
        <div class="rounded-lg shadow-md overflow-hidden">
          <a [href]="ad.link" target="_blank" rel="noopener noreferrer">
            <img [src]="ad.imageUrl" alt="Ad" class="w-full h-auto">
          </a>
        </div>
      </div>
    </div>
    <div class="flex justify-center space-x-4 mt-4">
      <button
        class="text-black bg-white  rounded-full w-12 h-12 text-lg drop-shadow-xl"
        (click)="dislike()"
        aria-label="Dislike"
      >
        ❌
      </button>
      <button
        class="text-black bg-white rounded-full w-12 h-12 text-lg drop-shadow-xl"
        (click)="nextFact()"
        aria-label="Skip"
      >
        ➖
      </button>
      <button
        class="text-black bg-white rounded-full w-12 h-12 text-lg drop-shadow-lg"
        (click)="like()"
        aria-label="Like"
      >
        💚️
      </button>
    </div>
    <div class="absolute inset-0 flex justify-center items-center pointer-events-none">
      <div
        *ngIf="showThumbsUp"
        class="text-green-500 text-6xl animate-thumbs"
        [@thumbsAnimation]
      >
        👍
      </div>
      <div
        *ngIf="showThumbsDown"
        class="text-red-500 text-6xl animate-thumbs"
        [@thumbsAnimation]
      >
        👎
      </div>
    </div>
  </ng-container>

  <ng-template #emptyMessage>
    <div class="text-center text-gray-500 mt-12">
      <p class="text-2xl font-semibold">Whoops!</p>
      <p class="mt-2">You’ve hit your fact limit for now.</p>
      <p>Looks like the fact machine needs a quick nap.</p>
      <p class="mt-4">Come back soon or test your skills in the Quiz.</p>
    </div>
  </ng-template>
</div>
