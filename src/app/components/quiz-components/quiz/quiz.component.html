<div class="p-4 max-w-md mx-auto text-center space-y-6">
  <div class="max-w-md mx-auto text-center space-y-6">
    <app-quiz-dropdown *ngIf="quizService.selectedAnswerIndex === null"></app-quiz-dropdown>
    <div *ngIf="!this.quizService.isLoading()" class="mt-0">
      <div class="text-sm text-gray-500 mb-1">Sponsored</div>
      <div class="rounded-lg shadow-md p-4 bg-white border border-gray-200">
        <div class="flex flex-col items-center">
          <div class="rounded-lg shadow-md overflow-hidden relative aspect-[16/5] w-full">
            <img
              [src]="'./ads/' + quizService.questions()[quizService.currentQuestionIndex].category.toLowerCase() + '.png'"
              [alt]="'Ad for ' + quizService.questions()[quizService.currentQuestionIndex].category"
              class="w-full h-full object-cover rounded"
              onerror="this.src='./ads/_fallback.png'; this.onerror=null;"
            />
          </div>
          <p class="mt-2 text-sm">{{ quizService.questions()[quizService.currentQuestionIndex].ad }}</p>
        </div>
      </div>
    </div>
    <div *ngIf="this.quizService.isLoading()" class="mt-2">
      <div class="h-4 bg-gray-200 rounded w-24 mx-auto mb-1"></div>
      <div class="rounded-lg shadow-md overflow-hidden relative aspect-[16/5] bg-gray-200"></div>
    </div>

    <div *ngIf="!this.quizService.isLoading()"
         class="bg-gray-200 pt-20 pb-20 pl-6 pr-6 rounded-lg shadow-xl text-xl font-semibold border-1 border-gray-300">
      {{ quizService.questions()[quizService.currentQuestionIndex].question }}
    </div>
    <div *ngIf="this.quizService.isLoading()" class="bg-gray-100 p-6 rounded-lg shadow">
      <div class="h-6 bg-gray-200 rounded w-3/4 mx-auto"></div>
      <div class="h-6 bg-gray-200 rounded w-1/2 mx-auto mt-2"></div>
    </div>

    <div class="w-full bg-gray-300 rounded-full overflow-hidden h-6">
      <div class="h-full bg-primary-500 transition-all duration-1000"
           [style.width.%]="(quizService.timer.timeLeft / 10) * 100"></div>
    </div>

    <div *ngIf="!this.quizService.isLoading()" class="grid grid-cols-2 gap-4 mt-4">
      <button *ngFor="let answer of quizService.questions()[quizService.currentQuestionIndex].answers; let i = index"
              (click)="answer.length > 0 ? quizService.selectAnswer(i) : null"
              class="pl-4 pr-4 pt-6 pb-6 rounded-lg text-lg font-medium border transition
                   duration-200"
              [ngClass]="{
              'bg-gray-100 text-green-400 border-dashed': quizService.selectedAnswerIndex !== i && quizService.selectedAnswerIndex !== null && i === quizService.questions()[quizService.currentQuestionIndex].correctAnswer,
              'bg-green-200 text-green-800': quizService.selectedAnswerIndex === i && i === quizService.questions()[quizService.currentQuestionIndex].correctAnswer,
              'bg-red-200 text-red-800': quizService.selectedAnswerIndex === i && i !== quizService.questions()[quizService.currentQuestionIndex].correctAnswer,
              'bg-white text-cyan-800 border-gray-200': quizService.selectedAnswerIndex === null,
              'bg-gray-100 text-gray-400 cursor-not-allowed': quizService.selectedAnswerIndex !== null && quizService.selectedAnswerIndex !== i,
              'cursor-not-allowed': answer.length <= 0
            }"
              [disabled]="quizService.selectedAnswerIndex !== null">
        {{ answer }}
      </button>
    </div>
    <div *ngIf="this.quizService.isLoading()" class="grid grid-cols-2 gap-4 mt-4">
      <div class="p-4 rounded-lg bg-gray-100 h-14"></div>
      <div class="p-4 rounded-lg bg-gray-100 h-14"></div>
      <div class="p-4 rounded-lg bg-gray-100 h-14"></div>
      <div class="p-4 rounded-lg bg-gray-100 h-14"></div>
    </div>

    <button
      *ngIf="quizService.selectedAnswerIndex !== null && quizService.currentQuestionIndex <= quizService.questions().length"
      class="mt-6 w-full py-2 bg-primary-500 text-white rounded-md relative"
      (click)="quizService.nextQuestion()">
      <span *ngIf="quizService.currentQuestionIndex < quizService.questions().length - 1">Next →</span>
      <span *ngIf="quizService.currentQuestionIndex === quizService.questions().length - 1">Finish Quiz</span>
    </button>
  </div>
</div>
