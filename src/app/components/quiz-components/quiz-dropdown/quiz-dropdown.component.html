<div *ngIf="dropdownVisible" class="fixed inset-0 bg-black backdrop-blur-sm z-10 overlay"></div>

<div class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-20">
  <div class="relative group">
    <button (click)="toggleDropdown()"
            class="w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-lg hover:bg-teal-700 focus:ring-4 focus:ring-teal-300 transition-all duration-300">
      <ng-container *ngIf="!dropdownVisible; else closeIcon">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.975a1 1 0 00.95.69h4.18c.969 0 1.371 1.24.588 1.81l-3.39 2.46a1 1 0 00-.364 1.118l1.287 3.974c.3.922-.755 1.688-1.538 1.118l-3.39-2.46a1 1 0 00-1.176 0l-3.39 2.46c-.783.57-1.838-.196-1.538-1.118l1.287-3.974a1 1 0 00-.364-1.118L2.045 9.402c-.783-.57-.38-1.81.588-1.81h4.18a1 1 0 00.95-.69l1.286-3.975z"/>
        </svg>
      </ng-container>
      <ng-template #closeIcon>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </ng-template>
    </button>

    <div class="absolute w-64 h-32 -top-32 left-1/2 transform -translate-x-1/2">
      <button (click)="useFiftyFifty()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[this.fiftyFiftyIndex].count === 0">
        50/50
        <span class="badge"
              *ngIf="jokers[this.fiftyFiftyIndex].count > 0">{{ jokers[this.fiftyFiftyIndex].count }}</span>
      </button>

      <button (click)="askAFriend()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[this.askAFriendIndex].count === 0">
        <svg class="w-7 h-7 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M17.5 3a3.5 3.5 0 0 0-3.456 4.06L8.143 9.704a3.5 3.5 0 1 0-.01 4.6l5.91 2.65a3.5 3.5 0 1 0 .863-1.805l-5.94-2.662a3.53 3.53 0 0 0 .002-.961l5.948-2.667A3.5 3.5 0 1 0 17.5 3Z"/>
        </svg>
        <svg class="w-7 h-7 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm9.008-3.018a1.502 1.502 0 0 1 2.522 1.159v.024a1.44 1.44 0 0 1-1.493 1.418 1 1 0 0 0-1.037.999V14a1 1 0 1 0 2 0v-.539a3.44 3.44 0 0 0 2.529-3.256 3.502 3.502 0 0 0-7-.255 1 1 0 0 0 2 .076c.014-.398.187-.774.48-1.044Zm.982 7.026a1 1 0 1 0 0 2H12a1 1 0 1 0 0-2h-.01Z"
                clip-rule="evenodd"/>
        </svg>


        <span class="badge"
              *ngIf="jokers[this.askAFriendIndex].count > 0">{{ jokers[this.askAFriendIndex].count }}</span>
      </button>

      <button (click)="addTime()"
              class="menu-button absolute w-18 h-18 rounded-full bg-gray-600 text-white flex items-center justify-center shadow-2xl hover:bg-gray-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[this.timeIndex].count === 0">
        <svg class="w-10 h-10 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm11-4a1 1 0 1 0-2 0v4a1 1 0 0 0 .293.707l3 3a1 1 0 0 0 1.414-1.414L13 11.586V8Z"
                clip-rule="evenodd"/>
        </svg>
        <span class="badge" *ngIf="jokers[this.timeIndex].count > 0">{{ jokers[this.timeIndex].count }}</span>
      </button>

      <button (click)="skipQuestion()"
              class="menu-button absolute w-18 h-18 rounded-full bg-green-500 text-white flex items-center justify-center shadow-2xl hover:bg-green-600"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[this.skipQuestionIndex].count === 0">
        <svg class="w-10 h-10 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
                d="M17 6a1 1 0 1 0-2 0v4L8.6 5.2A1 1 0 0 0 7 6v12a1 1 0 0 0 1.6.8L15 14v4a1 1 0 1 0 2 0V6Z"
                clip-rule="evenodd"/>
        </svg>

        <span class="badge"
              *ngIf="jokers[this.skipQuestionIndex].count > 0">{{ jokers[this.skipQuestionIndex].count }}</span>
      </button>
    </div>
  </div>
</div>
