<div *ngIf="dropdownVisible"
     [ngClass]="{'animate-fade-in': !fadeOutActive, 'animate-fade-out': fadeOutActive}"
     class="fixed inset-0 backdrop-blur-sm z-10 overlay"
     style="background-color: rgba(0, 0, 0, 0.5);">
</div>
<div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-20">
  <div class="relative group">
    <button (click)="toggleDropdown()"
            class="w-18 h-18 rounded-full bg-primary-500 text-white flex items-center justify-center shadow-lg hover:bg-teal-700 focus:ring-4 focus:ring-teal-300 transition-all duration-300">
      <ng-container *ngIf="!dropdownVisible; else closeIcon">
        <svg class="w-9 h-9 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
             fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-width="2"
                d="M11.083 5.104c.35-.8 1.485-.8 1.834 0l1.752 4.022a1 1 0 0 0 .84.597l4.463.342c.9.069 1.255 1.2.556 1.771l-3.33 2.723a1 1 0 0 0-.337 1.016l1.03 4.119c.214.858-.71 1.552-1.474 1.106l-3.913-2.281a1 1 0 0 0-1.008 0L7.583 20.8c-.764.446-1.688-.248-1.474-1.106l1.03-4.119A1 1 0 0 0 6.8 14.56l-3.33-2.723c-.698-.571-.342-1.702.557-1.771l4.462-.342a1 1 0 0 0 .84-.597l1.753-4.022Z"/>
        </svg>

      </ng-container>
      <ng-template #closeIcon>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </ng-template>
    </button>

    <div class="absolute w-64 h-32 -top-32 left-1/2 transform -translate-x-1/2">
      <button (click)="useFiftyFifty()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="fiftyFiftyIndex === -1 || jokers[fiftyFiftyIndex].count === 0">
        50/50
        <span class="badge"
              *ngIf="fiftyFiftyIndex !== -1 && (jokers[fiftyFiftyIndex]?.count ?? -1) > 0">{{ jokers[fiftyFiftyIndex].count }}</span>
      </button>

      <button (click)="multiplyPoints()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="multiplyPointsIndex === -1 || jokers[multiplyPointsIndex].count === 0">
        <svg class="w-16 h-16 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m16 17-4-4-4 4m8-6-4-4-4 4"/>
        </svg>
        <span class="badge"
              *ngIf="multiplyPointsIndex !== -1 && (jokers[multiplyPointsIndex]?.count ?? -1) > 0">{{ jokers[multiplyPointsIndex].count }}</span>
      </button>

      <button (click)="addTime()"
              class="menu-button absolute w-18 h-18 rounded-full bg-gray-600 text-white flex items-center justify-center shadow-2xl hover:bg-gray-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="timeIndex === -1 || jokers[timeIndex].count === 0">
        <svg class="w-10 h-10 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm11-4a1 1 0 1 0-2 0v4a1 1 0 0 0 .293.707l3 3a1 1 0 0 0 1.414-1.414L13 11.586V8Z"
                clip-rule="evenodd"/>
        </svg>
        <span class="badge"
              *ngIf="timeIndex !== -1 && (jokers[timeIndex]?.count ?? -1) > 0">{{ jokers[timeIndex].count }}</span>
      </button>

      <button (click)="skipQuestion()"
              class="menu-button absolute w-18 h-18 rounded-full bg-green-500 text-white flex items-center justify-center shadow-2xl hover:bg-green-600"
              [class.visible]="dropdownVisible"
              [class.disabled]="skipQuestionIndex === -1 || jokers[skipQuestionIndex].count === 0">
        <svg class="w-10 h-10 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
                d="M17 6a1 1 0 1 0-2 0v4L8.6 5.2A1 1 0 0 0 7 6v12a1 1 0 0 0 1.6.8L15 14v4a1 1 0 1 0 2 0V6Z"
                clip-rule="evenodd"/>
        </svg>

        <span class="badge"
              *ngIf="skipQuestionIndex !== -1 && (jokers[skipQuestionIndex]?.count ?? -1) > 0">{{ jokers[skipQuestionIndex].count }}</span>
      </button>
    </div>
  </div>
</div>
