<div *ngIf="dropdownVisible" class="fixed inset-0 bg-black backdrop-blur-sm z-10 overlay"></div>

<div class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-20">
  <div class="relative group">
    <button (click)="toggleDropdown()"
            class="w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-lg hover:bg-teal-700 focus:ring-4 focus:ring-teal-300 transition-all duration-300">
      <ng-container *ngIf="!dropdownVisible; else closeIcon">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.975a1 1 0 00.95.69h4.18c.969 0 1.371 1.24.588 1.81l-3.39 2.46a1 1 0 00-.364 1.118l1.287 3.974c.3.922-.755 1.688-1.538 1.118l-3.39-2.46a1 1 0 00-1.176 0l-3.39 2.46c-.783.57-1.838-.196-1.538-1.118l1.287-3.974a1 1 0 00-.364-1.118L2.045 9.402c-.783-.57-.38-1.81.588-1.81h4.18a1 1 0 00.95-.69l1.286-3.975z"/>
        </svg>
      </ng-container>
      <ng-template #closeIcon>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </ng-template>
    </button>

    <div class="absolute w-64 h-32 -top-32 left-1/2 transform -translate-x-1/2">
      <button (click)="useFiftyFifty()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[0].count === 0">
        50/50
        <span class="badge" *ngIf="jokers[0].count > 0">{{ jokers[0].count }}</span>
      </button>

      <button (click)="useBoost()"
              class="menu-button absolute w-18 h-18 rounded-full bg-teal-600 text-white flex items-center justify-center shadow-2xl hover:bg-teal-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[1].count === 0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
        </svg>
        <span class="badge" *ngIf="jokers[1].count > 0">{{ jokers[1].count }}</span>
      </button>

      <button (click)="useTime()"
              class="menu-button absolute w-18 h-18 rounded-full bg-gray-600 text-white flex items-center justify-center shadow-2xl hover:bg-gray-700"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[2].count === 0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
        </svg>
        <span class="badge" *ngIf="jokers[2].count > 0">{{ jokers[2].count }}</span>
      </button>

      <button (click)="addAction()"
              class="menu-button absolute w-18 h-18 rounded-full bg-green-500 text-white flex items-center justify-center shadow-2xl hover:bg-green-600"
              [class.visible]="dropdownVisible"
              [class.disabled]="jokers[3].count === 0">
        +
        <span class="badge" *ngIf="jokers[3].count > 0">{{ jokers[3].count }}</span>
      </button>
    </div>
  </div>
</div>
