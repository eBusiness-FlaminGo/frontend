<div class="p-6 max-w-md mx-auto text-center space-y-6">
  <h2 class="text-2xl font-bold">Brain just got a boost?</h2>

  <div class="flex flex-col items-center space-y-4">
    <img src="./flamingo.png" alt="avatar" class="w-16 h-16 rounded-full" />

    <div
      class="bg-cyan-900 text-white px-4 rounded-lg text-sm font-semibold flex flex-col justify-center items-center transition-all duration-300"
      [style.height]="pointsBarHeight">
      {{ result.points }} Pts<br />
      <span class="text-base">{{ getOrdinal(result.rank) }}</span>
    </div>

    <div class="text-base">
      You answered <span class="font-bold text-lg">{{ result.correctAnswers }} out of {{ result.totalQuestions
        }}</span><br />
      questions correctly and earned <span class="font-semibold">{{ result.points }} points</span>!
    </div>

    <button class="collect-tickets-btn px-4 py-2 rounded-md font-bold text-sm flex items-center gap-2"
      (click)="collectTickets()">
      Collect {{ result.ticketsEarned }} tickets
      <svg class="w-6 h-6 text-yellow-100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M4 5a2 2 0 0 0-2 2v2.5a1 1 0 0 0 1 1 1.5 1.5 0 1 1 0 3 1 1 0 0 0-1 1V17a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2.5a1 1 0 0 0-1-1 1.5 1.5 0 1 1 0-3 1 1 0 0 0 1-1V7a2 2 0 0 0-2-2H4Z" />
      </svg>
    </button>
  </div>

  <div class="space-y-3">
    <button [routerLink]="[ROUTES.root,ROUTES.stats]"
      class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md flex justify-center items-center gap-2">
      See the leaderboard <span class="text-lg">
      <svg class="w-6 h-6 text-teal-800 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
           fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6h8m-8 6h8m-8 6h8M4 16a2 2 0 1 1 3.321 1.5L4 20h5M4 5l2-1v6m-2 0h4"/>
      </svg>
    </span>
    </button>

    <button class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md flex justify-center items-center gap-2">
      Check out the Daily Challenges <span class="text-lg">
      <svg class="w-6 h-6 text-primary-800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4l3 3M3.22302 14C4.13247 18.008 7.71683 21 12 21c4.9706 0 9-4.0294 9-9 0-4.97056-4.0294-9-9-9-3.72916 0-6.92858 2.26806-8.29409 5.5M7 9H3V5"/>
    </svg>
    </span>
    </button>

    <button [routerLink]="[ROUTES.root,ROUTES.quizSelection,ROUTES.quiz,'']"
      class="w-full bg-cyan-600 text-white font-semibold py-2 rounded-md flex justify-center items-center gap-2">
      Play again <span class="text-lg">→</span>
    </button>

    <button [routerLink]="'/' + ROUTES.quizSelection" class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md">
      Back to selection
    </button>
  </div>
</div>
