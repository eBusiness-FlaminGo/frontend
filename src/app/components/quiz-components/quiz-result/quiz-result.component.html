<div class="p-6 max-w-md mx-auto text-center space-y-6">
  <h2 class="text-2xl font-bold">Brain just got a boost?</h2>

  <div class="flex flex-col items-center space-y-4">
    <img src="./flamingo.png" alt="avatar" class="w-16 h-16 rounded-full"/>

    <div class="bg-cyan-900 text-white px-4 py-2 rounded-lg text-sm font-semibold">
      {{ result.points }} Pts<br/>
      <span class="text-base">{{ result.rank }}th</span>
    </div>

    <div class="text-base">
      You answered <span class="font-bold text-lg">{{ result.correctAnswers }} out of {{ result.totalQuestions }}</span><br/>
      questions correctly and earned <span class="font-semibold">{{ result.points }} points</span>!
    </div>

    <button class="bg-black text-yellow-400 px-4 py-2 rounded-md font-bold text-sm">
      Collect {{ result.ticketsEarned }} tickets 🎟️
    </button>
  </div>

  <div class="space-y-3">
    <button [routerLink]="[ROUTES.root,ROUTES.stats]" class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md flex justify-center items-center gap-2">
      See the leaderboard <span class="text-lg">📊</span>
    </button>

    <button class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md flex justify-center items-center gap-2">
      Check out the Daily Challenges <span class="text-lg">🕒</span>
    </button>

    <button [routerLink]="[ROUTES.root,ROUTES.quizSelection,ROUTES.quiz,'']" class="w-full bg-cyan-600 text-white font-semibold py-2 rounded-md flex justify-center items-center gap-2">
      Play again <span class="text-lg">→</span>
    </button>

    <button [routerLink]="'/' + ROUTES.quizSelection" class="w-full bg-cyan-100 text-black font-medium py-2 rounded-md">
      Back to selection
    </button>
  </div>
</div>
