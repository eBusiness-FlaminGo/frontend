<div class="max-w-md mx-auto p-4">
  <h1 class="text-center text-2xl font-semibold mb-4">Leaderboard</h1>
  <div class="flex justify-center space-x-2 mb-2">
    <button
      *ngFor="let view of views"
      (click)="switchView(view)"
      class="px-4 py-1 rounded-full"
      [ngClass]="{
        'bg-blue-700 text-white': currentView === view,
        'bg-gray-200 text-black': currentView !== view
      }"
    >
      {{ view }}
    </button>
  </div>

  <div class="text-center text-sm text-gray-600 mb-4">
    ⏳ <span *ngIf="currentView === 'Week'">3d left</span>
    <span *ngIf="currentView === 'Month'">10d left</span>
  </div>

  <div class="grid grid-cols-3 gap-2 items-end mb-6">
    <div *ngFor="let player of podium; let i = index" class="text-center">
      <div class="text-4xl">{{ player.avatar }}</div>
      <div class="text-sm font-medium">{{ player.name }}</div>
      <div class="text-xs text-gray-600">{{ player.points }} Pts</div>
      <div class="mt-2 bg-teal-800 text-white p-2 rounded-lg">
        <div class="text-2xl font-bold">{{ i + 1 }}</div>
        <div *ngIf="player.reward" class="text-sm">{{ player.reward }} 🎟</div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow divide-y divide-gray-200">
    <div
      *ngFor="let player of rest; let i = index"
      class="p-4 flex justify-between items-center"
      [ngClass]="{ 'bg-cyan-100': player.name === 'You' }"
    >
      <div class="text-sm font-medium w-1/6">{{ i + 4 }}</div>
      <div class="flex items-center gap-2 w-3/6">
        <span class="text-2xl">{{ player.avatar }}</span>
        <span>{{ player.name }}</span>
      </div>
      <div class="text-right text-sm w-2/6">
        {{ player.reward ? player.reward + ' 🎟' : player.points + ' Pts' }}
      </div>
    </div>
  </div>
</div>
