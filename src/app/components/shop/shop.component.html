<div class="p-4 max-w-md mx-auto space-y-6">
  <h2 class="text-center text-xl font-bold">Shop</h2>

  <h3 class="text-lg font-semibold">Lootboxen</h3>
  <div class="grid grid-cols-3 gap-4">
    <div *ngFor="let box of lootboxes" (click)="purchase(box)"
         class="bg-cyan-100 p-2 rounded-lg text-center space-y-2 cursor-pointer hover:shadow">
      <img [src]="box.image" alt="lootbox" class="mx-auto h-16"/>
      <div class="font-semibold">{{ box.label }}</div>
      <div class="bg-cyan-600 text-white rounded-md px-2 py-1 text-sm">
        {{ box.cost }}
        <span>
          <svg class="w-auto h-5 text-yellow-900 inline" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg"
               width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path
            d="M4 5a2 2 0 0 0-2 2v2.5a1 1 0 0 0 1 1 1.5 1.5 0 1 1 0 3 1 1 0 0 0-1 1V17a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2.5a1 1 0 0 0-1-1 1.5 1.5 0 1 1 0-3 1 1 0 0 0 1-1V7a2 2 0 0 0-2-2H4Z"/>
        </svg>
      </span>
      </div>
      <div class="text-xs text-gray-500">umgerechnet {{ box.priceEUR }}</div>
    </div>
  </div>

  <h3 class="text-lg font-semibold mt-4">Tickets</h3>
  <div class="grid grid-cols-3 gap-4">
    <div *ngFor="let ticket of tickets" (click)="purchase(ticket)"
         class="bg-cyan-100 p-2 rounded-lg text-center space-y-2 relative cursor-pointer hover:shadow">
      <img src="./tickets.png" alt="lootbox" class="mx-auto h-16"/>
      <div *ngIf="ticket.bonus" class="absolute top-1 left-1 bg-yellow-200 text-yellow-800 text-xs px-1 rounded">
        +{{ ticket.bonus }} Bonus!
      </div>
      <div class="text-xl font-bold">{{ ticket.quantity + (ticket.bonus ?? 0) }}</div>
      <div class="text-sm">{{ ticket.label }}</div>
      <div class="bg-white rounded px-2 py-1 text-sm shadow">{{ ticket.priceEUR }}</div>
    </div>
  </div>

  <div class="text-center mt-4 text-sm">
    Need more Tickets? Try these daily challenges!
  </div>
  <div class="flex justify-center">
    <button class="bg-cyan-600 text-white px-4 py-2 rounded-full mt-2 text-sm flex items-center gap-1">
      Daily Challenges →
    </button>
  </div>
</div>
