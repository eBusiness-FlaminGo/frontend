<div class="layout">
  <app-header
    *ngIf="this.userService.getUserProfile()?.isLoggedIn && this.userService.getUserProfile()?.isSetUp && !isInSettings()"></app-header>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
  <app-navigation
    *ngIf="this.userService.getUserProfile()?.isLoggedIn && this.userService.getUserProfile()?.isSetUp && !this.quizService.isActive() && !isInSettings()"></app-navigation>
</div>
