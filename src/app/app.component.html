<div class="layout">
  <app-header
    *ngIf="showHeader()"></app-header>
  <main class="content"
        [class.no-header]="!showHeader()"
        [class.no-navigation]="!showNavigation()">
    <router-outlet></router-outlet>
  </main>
  <app-navigation
    *ngIf="showNavigation()"></app-navigation>
</div>
